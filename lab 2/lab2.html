
<!DOCTYPE html>
<html>
<head>
    <title>Greeting App</title>
	
<style>
    body {
        font-family: Arial;
        background-color: #FFF0F5;
        text-align: center;
        padding: 40px;
    }

    h1 {
        color: #C06086;
    }

    input {
        padding: 10px;
        border: 1px solid #F2B6CE;
        border-radius: 5px;
        background-color: white;
    }

    button {
        padding: 10px 15px;
        background-color: #E8A0BF;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }

    ul {
        list-style-position: inside;
        padding: 0;
        color: #C06086;
    }

    li {
        padding: 8px;
        cursor: pointer;
    }
</style>

</head>
<body>

    <h1 id="title">Welcome</h1>

    <input id="name" placeholder="Your name" />

    <button id="greet">Greet</button>

    <ul id="list"></ul>

    <!-- Connect the JavaScript file -->
    <script src="myscript.js"></script>

</body>
</html>
